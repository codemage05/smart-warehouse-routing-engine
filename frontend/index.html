<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Warehouse Routing Engine</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; min-height: 100%; background: #070b14; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-src">
const { useState, useRef, useEffect } = React;

const N = 15;
// Same origin when Flask serves this page (port 5000); otherwise talk to the local Flask server directly.
const API_BASE = window.location.port === "5000" ? "" : "http://127.0.0.1:5000";
type Pt = { r: number; c: number };
type Mode = "wall" | "start" | "goal";
type Result = { found: boolean; path: Pt[]; explored: Pt[] };

const key = (r: number, c: number) => r * N + c;
const at = (p: Pt, r: number, c: number) => p.r === r && p.c === c;
const blank = () => Array.from({ length: N }, () => new Array(N).fill(false) as boolean[]);

/* ---------- Lucide icons (inlined SVG paths) ---------- */
type IP = { size?: number; className?: string };
const Icon = ({ size = 18, className = "", children }: IP & { children: any }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2}
    strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
);
const Play = (p: IP) => <Icon {...p}><polygon points="6 3 20 12 6 21 6 3" /></Icon>;
const Trash = (p: IP) => <Icon {...p}><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></Icon>;
const Bot = (p: IP) => <Icon {...p}><path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></Icon>;
const Pkg = (p: IP) => <Icon {...p}><path d="m7.5 4.27 9 5.15" /><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></Icon>;
const Sq = (p: IP) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2" /></Icon>;

/* ---------- UI ---------- */
const START0: Pt = { r: 7, c: 1 };
const GOAL0: Pt = { r: 7, c: 13 };

function App() {
  const [walls, setWalls] = useState<boolean[][]>(blank);
  const [start, setStart] = useState<Pt>(START0);
  const [goal, setGoal] = useState<Pt>(GOAL0);
  const [mode, setMode] = useState<Mode>("wall");
  const [res, setRes] = useState<Result | null>(null);
  const [seen, setSeen] = useState(0);
  const [step, setStep] = useState(-1);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState<string | null>(null);
  const painting = useRef<"add" | "remove" | null>(null);
  const timer = useRef(0);

  useEffect(() => {
    const up = () => { painting.current = null; };
    window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mouseup", up); clearTimeout(timer.current); };
  }, []);

  const reset = () => { clearTimeout(timer.current); setBusy(false); setRes(null); setSeen(0); setStep(-1); setError(null); };

  const apply = (r: number, c: number) => {
    if (busy) return;
    if (mode === "start") {
      if (!walls[r][c] && !at(goal, r, c)) { setStart({ r, c }); reset(); }
      return;
    }
    if (mode === "goal") {
      if (!walls[r][c] && !at(start, r, c)) { setGoal({ r, c }); reset(); }
      return;
    }
    if (at(start, r, c) || at(goal, r, c)) return;
    const want = painting.current === "add";
    if (walls[r][c] === want) return;
    setWalls(w => w.map((row, i) => (i === r ? row.map((v, j) => (j === c ? want : v)) : row)));
    reset();
  };

  const calculate = () => {
    reset();
    setBusy(true);

    fetch(`${API_BASE}/api/calculate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ walls, start, goal }),
    })
      .then(async response => {
        if (!response.ok) {
          const body = await response.json().catch(() => null);
          throw new Error(body?.error || `Server error (${response.status})`);
        }
        return response.json() as Promise<Result>;
      })
      .then(out => {
        setRes(out);
        let i = 0, j = -1;
        // Phase 1: reveal explored nodes in expansion order. Phase 2: draw the route cell by cell.
        const tick = () => {
          if (i < out.explored.length) { i++; setSeen(i); timer.current = window.setTimeout(tick, 16); }
          else if (j < out.path.length - 1) { j++; setStep(j); timer.current = window.setTimeout(tick, 60); }
          else setBusy(false);
        };
        tick();
      })
      .catch(error => {
        console.error("Unable to calculate route:", error);
        setError(error instanceof TypeError
          ? "Cannot reach the routing server. Run `python3 app.py` in backend/ (http://127.0.0.1:5000)."
          : error.message);
        setBusy(false);
      });
  };

  
  const clearGrid = () => { reset(); setWalls(blank()); setStart(START0); setGoal(GOAL0); };

  const exp = new Set<number>();
  if (res) res.explored.slice(0, seen).forEach(p => exp.add(key(p.r, p.c)));
  const pidx = new Map<number, number>();
  if (res) res.path.forEach((p, i) => pidx.set(key(p.r, p.c), i));

  const cellClass = (r: number, c: number) => {
    if (at(start, r, c)) return "bg-emerald-400 text-slate-950 shadow-[0_0_14px_rgba(52,211,153,0.7)] z-10";
    if (at(goal, r, c)) return "bg-amber-400 text-slate-950 shadow-[0_0_14px_rgba(251,191,36,0.7)] z-10";
    if (walls[r][c]) return "bg-gradient-to-br from-slate-500 to-slate-700 border border-slate-400/30";
    const i = pidx.get(key(r, c));
    if (i !== undefined && i <= step)
      return i === step ? "bg-cyan-200 shadow-[0_0_12px_rgba(103,232,249,0.9)] scale-110 z-10" : "bg-cyan-400/90";
    if (exp.has(key(r, c))) return "bg-indigo-500/30";
    return "bg-slate-800/70 hover:bg-slate-700";
  };

  const modes = [
    { id: "wall", label: "Obstacles", Ico: Sq },
    { id: "start", label: "Robot", Ico: Bot },
    { id: "goal", label: "Target", Ico: Pkg },
  ];
  const status = error ? error
    : busy ? "Searching the state space…"
    : !res ? "Ready. Shape the floor plan, then calculate."
    : res.found ? "Optimal route found." : "No route exists. The target is walled off.";
  const statusColor = error || (res && !busy && !res.found) ? "text-rose-400"
    : res && !busy && res.found ? "text-emerald-300" : "text-slate-400";
  const pathLen = res && res.found ? Math.max(step, 0) : 0;

  return (
    <div className="min-h-screen font-sans text-slate-200" style={{ background: "radial-gradient(900px 500px at 15% -10%, rgba(99,102,241,0.18), transparent), radial-gradient(700px 400px at 100% 0%, rgba(34,211,238,0.10), transparent), #070b14" }}>
      <div className="mx-auto max-w-6xl px-4 py-8">
        <header className="mb-6">
          <div className="inline-flex items-center gap-2 rounded-full border border-indigo-400/30 bg-indigo-500/10 px-3 py-1 text-xs text-indigo-300">
            <Bot size={14} /> A* pathfinding · Manhattan heuristic
          </div>
          <h1 className="mt-3 text-3xl font-semibold tracking-tight text-white sm:text-4xl">Smart Warehouse Routing Engine</h1>
          <p className="mt-2 max-w-2xl text-slate-400">
            Design a warehouse floor, then watch A* expand its search frontier using{" "}
            <span className="font-mono text-cyan-300">f(n) = g(n) + h(n)</span> before the forklift commits to the shortest route.
          </p>
        </header>

        <div className="flex flex-col gap-6 lg:flex-row">
          <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4 shadow-2xl shadow-black/40 backdrop-blur">
            <div
              className="grid select-none gap-[3px]"
              style={{ gridTemplateColumns: `repeat(${N}, minmax(0, 1fr))`, width: "min(100%, 620px)" }}
              onDragStart={e => e.preventDefault()}
            >
              {Array.from({ length: N * N }, (_, n) => {
                const r = Math.floor(n / N), c = n % N;
                return (
                  <div
                    key={n}
                    onMouseDown={() => { painting.current = walls[r][c] ? "remove" : "add"; apply(r, c); }}
                    onMouseEnter={() => { if (painting.current && mode === "wall") apply(r, c); }}
                    className={`relative flex aspect-square items-center justify-center rounded-[4px] transition-all duration-150 ${busy ? "cursor-wait" : "cursor-pointer"} ${cellClass(r, c)}`}
                    style={{ width: "min(7vw, 38px)", height: "min(7vw, 38px)" }}
                  >
                    {at(start, r, c) && <Bot size={18} />}
                    {at(goal, r, c) && <Pkg size={18} />}
                  </div>
                );
              })}
            </div>
          </div>

          <aside className="flex w-full flex-col gap-4 lg:w-80">
            <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
              <h2 className="mb-3 text-xs font-medium uppercase tracking-widest text-slate-500">Placement mode</h2>
              <div className="grid grid-cols-3 gap-2">
                {modes.map(({ id, label, Ico }) => (
                  <button key={id} onClick={() => setMode(id as Mode)}
                    className={`flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-xs transition ${mode === id ? "border-indigo-400/60 bg-indigo-500/15 text-white" : "border-slate-800 bg-slate-800/40 text-slate-400 hover:text-slate-200"}`}>
                    <Ico size={18} /> {label}
                  </button>
                ))}
              </div>
              <div className="mt-4 flex gap-2">
                <button onClick={calculate} disabled={busy}
                  className="inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 px-4 py-2.5 font-medium text-white shadow-lg shadow-indigo-500/20 transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-50">
                  <Play size={16} /> Calculate Path
                </button>
                <button onClick={clearGrid}
                  className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-800/60 px-4 py-2.5 text-slate-300 transition hover:bg-slate-700">
                  <Trash size={16} /> Clear Grid
                </button>
              </div>
            </section>

            <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
              <h2 className="mb-3 text-xs font-medium uppercase tracking-widest text-slate-500">Performance</h2>
              <div className="grid grid-cols-2 gap-3">
                <div className="rounded-xl bg-slate-800/50 p-3">
                  <div className="font-mono text-3xl font-semibold text-indigo-300">{res ? seen : 0}</div>
                  <div className="mt-1 text-xs text-slate-500">Nodes explored</div>
                </div>
                <div className="rounded-xl bg-slate-800/50 p-3">
                  <div className="font-mono text-3xl font-semibold text-cyan-300">{pathLen}</div>
                  <div className="mt-1 text-xs text-slate-500">Path length</div>
                </div>
              </div>
              <p className={`mt-3 text-sm ${statusColor}`}>{status}</p>
            </section>

            <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
              <h2 className="mb-3 text-xs font-medium uppercase tracking-widest text-slate-500">Legend</h2>
              <div className="grid grid-cols-2 gap-y-2 text-xs text-slate-400">
                {[["bg-emerald-400", "Robot (start)"], ["bg-amber-400", "Target (goal)"], ["bg-slate-500", "Rack / wall"], ["bg-indigo-500/40", "Explored node"], ["bg-cyan-400", "Final path"]].map(([c, t]) => (
                  <div key={t} className="flex items-center gap-2"><span className={`h-3 w-3 rounded-sm ${c}`} />{t}</div>
                ))}
              </div>
            </section>
          </aside>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  try {
    var out = Babel.transform(document.getElementById("app-src").textContent, {
      filename: "app.tsx",
      presets: ["react", "typescript"]
    }).code;
    var s = document.createElement("script");
    s.text = out;
    document.body.appendChild(s);
  } catch (e) {
    document.getElementById("root").textContent = "Failed to start: " + e.message;
    document.getElementById("root").style.cssText = "color:#fca5a5;padding:24px;font-family:monospace";
  }
</script>
</body>
</html>
